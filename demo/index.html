<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAP Transaction Forensics — Live Demo</title>
<meta name="description" content="Forensic anomaly detection across SAP ERP and Salesforce CRM. Read-only, evidence-graded, MIT licensed.">
<style>
  :root {
    --bg: #05070d;
    --bg2: #0a0e1a;
    --surface: rgba(17,24,39,0.72);
    --surface-solid: #0e1524;
    --border: rgba(59,130,246,0.16);
    --border-bright: rgba(99,179,255,0.45);
    --text: #eaf1fb;
    --muted: #93a4bd;
    --dim: #5b6c86;
    --accent: #3b82f6;
    --accent2: #8b5cf6;
    --cyan: #22d3ee;
    --critical: #ff4d4d;
    --high: #ff8a3d;
    --medium: #ffd23d;
    --low: #34d399;
    --mono: 'SF Mono','JetBrains Mono','Fira Code',ui-monospace,monospace;
    --sans: -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--sans);
    font-size: 14px; line-height: 1.6; min-height: 100vh; overflow-x: hidden;
  }
  a { color: var(--cyan); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px; position: relative; z-index: 2; }
  ::selection { background: rgba(59,130,246,0.4); }

  /* Animated canvas background */
  #net { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background:
      radial-gradient(900px circle at 12% -5%, rgba(59,130,246,0.16), transparent 45%),
      radial-gradient(800px circle at 95% 5%, rgba(139,92,246,0.14), transparent 42%),
      radial-gradient(700px circle at 50% 110%, rgba(34,211,238,0.08), transparent 50%);
  }

  /* Scan intro overlay */
  #scan {
    position: fixed; inset: 0; z-index: 999; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; transition: opacity .6s ease, visibility .6s; font-family: var(--mono);
  }
  #scan.done { opacity: 0; visibility: hidden; }
  .scan-logo {
    width: 56px; height: 56px; border-radius: 14px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center; font-size: 28px; color: #fff;
    box-shadow: 0 0 40px rgba(59,130,246,0.55); animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{transform:scale(1);box-shadow:0 0 30px rgba(59,130,246,.4)} 50%{transform:scale(1.07);box-shadow:0 0 55px rgba(139,92,246,.65)} }
  .scan-lines { width: min(440px,80vw); font-size: 12.5px; color: var(--low); min-height: 110px; }
  .scan-lines div { opacity: 0; animation: lineIn .35s forwards; }
  .scan-lines .muted { color: var(--dim); }
  @keyframes lineIn { from{opacity:0;transform:translateX(-6px)} to{opacity:1;transform:none} }
  .scan-bar { width: min(440px,80vw); height: 3px; background: rgba(255,255,255,0.06); border-radius: 2px; overflow: hidden; }
  .scan-bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg,var(--accent),var(--cyan)); animation: fill 2.1s ease forwards; }
  @keyframes fill { to { width: 100%; } }

  /* Header */
  header.site { position: sticky; top: 0; z-index: 50; backdrop-filter: blur(12px);
    background: rgba(5,7,13,0.72); border-bottom: 1px solid var(--border); }
  .site-inner { display: flex; align-items: center; justify-content: space-between; padding: 13px 24px; max-width: 1180px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo { width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(135deg,var(--accent),var(--accent2));
    display: flex; align-items: center; justify-content: center; font-weight: 800; color: #fff; box-shadow: 0 4px 18px rgba(59,130,246,0.3); }
  .brand h1 { font-size: 15px; font-weight: 700; }
  .brand .sub { font-size: 11px; color: var(--dim); font-family: var(--mono); }
  .nav-links { display: flex; gap: 18px; align-items: center; font-size: 13px; }
  .nav-links a { color: var(--muted); }
  .gh-btn { border: 1px solid var(--border-bright); padding: 7px 15px; border-radius: 8px; color: var(--text); font-weight: 600; }
  .gh-btn:hover { background: rgba(59,130,246,0.12); text-decoration: none; box-shadow: 0 0 20px rgba(59,130,246,0.25); }

  /* Hero */
  .hero { padding: 70px 0 20px; text-align: center; }
  .eyebrow { display: inline-flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 12px; color: var(--low);
    border: 1px solid rgba(52,211,153,0.3); background: rgba(52,211,153,0.06); padding: 6px 14px; border-radius: 999px; margin-bottom: 22px; }
  .eyebrow .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--low); box-shadow: 0 0 10px var(--low); animation: blink 1.6s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.35} }
  .hero h2 { font-size: clamp(32px,5vw,52px); line-height: 1.08; font-weight: 850; letter-spacing: -0.025em; margin-bottom: 18px; }
  .hero h2 .grad { background: linear-gradient(110deg,#60a5fa,#a78bfa 50%,#22d3ee); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero p.lede { font-size: 18px; color: var(--muted); max-width: 700px; margin: 0 auto 26px; }
  .hero p.lede b { color: var(--text); }
  .badges { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .badge { font-family: var(--mono); font-size: 11.5px; color: var(--muted); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; background: var(--surface); }
  .badge b { color: var(--text); }

  /* KPI grid */
  .kpis { display: grid; grid-template-columns: repeat(6,1fr); gap: 14px; margin: 40px 0 8px; }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px 14px; text-align: center;
    position: relative; overflow: hidden; backdrop-filter: blur(6px); }
  .kpi::before { content:""; position:absolute; inset:0 0 auto 0; height:2px; background:linear-gradient(90deg,var(--accent),var(--accent2)); }
  .kpi .num { font-size: 32px; font-weight: 850; letter-spacing: -0.02em; line-height: 1; font-variant-numeric: tabular-nums; }
  .kpi .lbl { font-size: 10.5px; color: var(--dim); margin-top: 9px; text-transform: uppercase; letter-spacing: 0.06em; }
  .kpi.alert .num { color: var(--high); text-shadow: 0 0 22px rgba(255,138,61,0.4); }
  .kpi.crit .num { color: var(--critical); text-shadow: 0 0 22px rgba(255,77,77,0.45); }

  /* Sections */
  section.block { padding: 56px 0; }
  .sec-head { margin-bottom: 26px; }
  .sec-head .kicker { font-family: var(--mono); font-size: 12px; color: var(--cyan); letter-spacing: 0.08em; text-transform: uppercase; }
  .sec-head h3 { font-size: 27px; font-weight: 850; letter-spacing: -0.01em; margin-top: 5px; }
  .sec-head p { color: var(--muted); margin-top: 7px; max-width: 780px; }

  /* reveal animation */
  .reveal { opacity: 0; transform: translateY(22px); transition: opacity .6s ease, transform .6s cubic-bezier(.2,.7,.2,1); }
  .reveal.in { opacity: 1; transform: none; }

  /* Risk gauge + summary band */
  .riskband { display: grid; grid-template-columns: 220px 1fr; gap: 26px; align-items: center;
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 26px; backdrop-filter: blur(6px); }
  .gauge { position: relative; width: 200px; height: 200px; margin: 0 auto; }
  .gauge svg { transform: rotate(-90deg); }
  .gauge .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .gauge .score { font-size: 46px; font-weight: 850; line-height: 1; font-variant-numeric: tabular-nums; }
  .gauge .of { font-size: 11px; color: var(--dim); font-family: var(--mono); margin-top: 4px; letter-spacing: 0.05em; }
  .riskcopy h4 { font-size: 19px; margin-bottom: 8px; }
  .riskcopy p { color: var(--muted); }
  .riskcopy .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .chip { font-family: var(--mono); font-size: 11px; padding: 5px 10px; border-radius: 7px; border: 1px solid var(--border); color: var(--muted); }
  .chip b { color: var(--text); }

  /* Anomaly cards */
  .anom-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 16px; }
  .anom { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden;
    transition: border-color .18s, transform .18s, box-shadow .18s; backdrop-filter: blur(6px); }
  .anom:hover { border-color: var(--border-bright); transform: translateY(-3px); box-shadow: 0 12px 40px rgba(0,0,0,0.4); }
  .anom-top { display: flex; align-items: flex-start; gap: 15px; padding: 17px 18px; cursor: pointer; }
  .anom-count { flex-shrink: 0; min-width: 56px; height: 56px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
    font-weight: 850; font-size: 23px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); font-variant-numeric: tabular-nums; }
  .anom-body { flex: 1; min-width: 0; }
  .anom-flag { font-family: var(--mono); font-size: 13.5px; font-weight: 700; display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
  .anom-desc { color: var(--muted); font-size: 13px; margin-top: 5px; }
  .anom-bar { height: 3px; background: rgba(255,255,255,0.05); border-radius: 2px; margin-top: 11px; overflow: hidden; }
  .anom-bar i { display: block; height: 100%; width: 0; border-radius: 2px; transition: width 1s cubic-bezier(.2,.7,.2,1); }
  .sev { font-family: var(--mono); font-size: 10px; font-weight: 700; text-transform: uppercase; padding: 2px 7px; border-radius: 5px; letter-spacing: 0.04em; }
  .sev.critical { color: var(--critical); background: rgba(255,77,77,0.12); border: 1px solid rgba(255,77,77,0.32); }
  .sev.high { color: var(--high); background: rgba(255,138,61,0.12); border: 1px solid rgba(255,138,61,0.32); }
  .sev.medium { color: var(--medium); background: rgba(255,210,61,0.12); border: 1px solid rgba(255,210,61,0.32); }
  .sev.low { color: var(--low); background: rgba(52,211,153,0.12); border: 1px solid rgba(52,211,153,0.32); }
  .c-critical { color: var(--critical) !important; border-color: rgba(255,77,77,0.4) !important; } .b-critical { background: linear-gradient(90deg,var(--critical),#b91c1c); }
  .c-high { color: var(--high) !important; border-color: rgba(255,138,61,0.4) !important; } .b-high { background: linear-gradient(90deg,var(--high),#c2410c); }
  .c-medium { color: var(--medium) !important; border-color: rgba(255,210,61,0.4) !important; } .b-medium { background: linear-gradient(90deg,var(--medium),#a16207); }
  .c-low { color: var(--low) !important; border-color: rgba(52,211,153,0.4) !important; } .b-low { background: linear-gradient(90deg,var(--low),#047857); }
  .chev { color: var(--dim); font-size: 12px; transition: transform .25s; margin-left: auto; padding-left: 10px; }
  .anom.open .chev { transform: rotate(90deg); }
  .evidence { max-height: 0; overflow: hidden; transition: max-height .35s ease; background: rgba(0,0,0,0.25); }
  .anom.open .evidence { max-height: 520px; border-top: 1px solid var(--border); }
  .ev-row { padding: 12px 18px; border-bottom: 1px solid var(--border); font-size: 12.5px; }
  .ev-row:last-child { border-bottom: none; }
  .ev-name { font-weight: 600; }
  .ev-meta { color: var(--dim); font-family: var(--mono); font-size: 11.5px; margin-top: 4px; display: flex; gap: 14px; flex-wrap: wrap; }
  .ev-meta b { color: var(--muted); font-weight: 600; }
  .ev-none { padding: 14px 18px; color: var(--dim); font-size: 12.5px; font-style: italic; }

  /* Cross-system diagram */
  .xsys { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .xdiagram { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 8px; backdrop-filter: blur(6px); }
  .xpanel { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 22px; backdrop-filter: blur(6px); }
  .xpanel h4 { font-size: 15px; margin-bottom: 14px; }
  .stat-row { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .stat-row:last-child { border-bottom: none; }
  .stat-row .k { color: var(--muted); } .stat-row .v { font-family: var(--mono); font-weight: 700; }
  .cross-list { display: flex; flex-direction: column; gap: 12px; margin-top: 18px; }
  .cross { display: flex; align-items: center; gap: 16px; background: var(--surface); border: 1px solid var(--border);
    border-left: 3px solid var(--high); border-radius: 11px; padding: 14px 18px; backdrop-filter: blur(6px); }
  .cross.medium { border-left-color: var(--medium); }
  .cross .ctype { font-family: var(--mono); font-size: 12px; font-weight: 700; min-width: 150px; color: var(--high); }
  .cross.medium .ctype { color: var(--medium); }
  .cross .cev { color: var(--muted); font-size: 13px; flex: 1; }
  .cross .clink { font-family: var(--mono); font-size: 11px; color: var(--dim); text-align: right; }

  /* Quarter chart */
  .qbars { display: flex; align-items: flex-end; gap: 8px; height: 220px; padding: 18px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 16px; backdrop-filter: blur(6px); }
  .qbar { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 6px; }
  .qbar .fill { width: 100%; border-radius: 5px 5px 0 0; background: rgba(99,179,255,0.18); height: 0; transition: height .9s cubic-bezier(.2,.7,.2,1); }
  .qbar.qend .fill { background: linear-gradient(180deg,var(--high),#9a3412); box-shadow: 0 0 24px rgba(255,138,61,0.35); }
  .qbar .mlbl { font-size: 10px; color: var(--dim); font-family: var(--mono); }
  .qbar .vlbl { font-size: 11px; color: var(--muted); font-weight: 700; }
  .callout { margin-top: 16px; background: rgba(255,138,61,0.07); border: 1px solid rgba(255,138,61,0.25); border-radius: 12px; padding: 15px 18px; font-size: 14px; }
  .callout b { color: var(--high); }

  /* Evidence terminal */
  .term { font-family: var(--mono); font-size: 12.5px; background: #04060c; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
  .term-bar { display: flex; align-items: center; gap: 7px; padding: 11px 15px; border-bottom: 1px solid var(--border); background: rgba(255,255,255,0.02); }
  .term-bar i { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
  .term-bar .r { background: #ff5f57; } .term-bar .y { background: #febc2e; } .term-bar .g { background: #28c840; }
  .term-bar span { color: var(--dim); margin-left: 8px; font-size: 11.5px; }
  .term-body { padding: 18px 20px; line-height: 1.85; white-space: pre-wrap; min-height: 220px; }
  .t-key { color: var(--cyan); } .t-sys { color: var(--accent2); } .t-val { color: var(--low); } .t-warn { color: var(--high); } .t-dim { color: var(--dim); }
  .cursor { display: inline-block; width: 8px; background: var(--low); animation: cur .9s steps(1) infinite; }
  @keyframes cur { 50% { opacity: 0; } }

  /* Case studies */
  .case-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; }
  .case { background: var(--surface); border: 1px solid var(--border); border-top: 3px solid var(--accent); border-radius: 14px;
    padding: 20px; backdrop-filter: blur(6px); transition: transform .18s, box-shadow .18s; }
  .case:hover { transform: translateY(-3px); box-shadow: 0 12px 40px rgba(0,0,0,0.4); }
  .case.c-border-critical { border-top-color: var(--critical); }
  .case.c-border-high { border-top-color: var(--high); }
  .case.c-border-medium { border-top-color: var(--medium); }
  .case-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  .case-tag { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .case-title { font-size: 16px; font-weight: 750; }
  .case-headline { color: var(--text); font-size: 13.5px; margin-top: 6px; font-weight: 600; }
  .case-stats { display: grid; grid-template-columns: repeat(2,1fr); gap: 8px; margin: 16px 0; }
  .case-stats div { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 9px; padding: 9px 10px; }
  .case-stats b { display: block; font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .case-stats span { font-size: 10.5px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.04em; }
  .case-body { color: var(--muted); font-size: 12.5px; line-height: 1.7; }
  .case-note { text-align: center; color: var(--dim); font-size: 12px; margin-top: 20px; font-style: italic; }

  /* CTA */
  .cta { text-align: center; padding: 60px 0; }
  .cta h3 { font-size: 30px; font-weight: 850; margin-bottom: 12px; }
  .cta p { color: var(--muted); max-width: 640px; margin: 0 auto 24px; }
  .cta .code { display: inline-block; text-align: left; font-family: var(--mono); font-size: 13.5px; background: #04060c;
    border: 1px solid var(--border-bright); border-radius: 12px; padding: 18px 22px; box-shadow: 0 0 40px rgba(59,130,246,0.15); }
  .cta .code .cm { color: var(--dim); } .cta .code .p { color: var(--cyan); }
  footer.site { border-top: 1px solid var(--border); padding: 30px 0; color: var(--dim); font-size: 12.5px; text-align: center; position: relative; z-index: 2; }

  .loading { text-align: center; padding: 90px 24px; color: var(--muted); position: relative; z-index: 2; }

  @media (max-width: 900px) {
    .kpis { grid-template-columns: repeat(3,1fr); }
    .anom-grid, .xsys { grid-template-columns: 1fr; }
    .riskband { grid-template-columns: 1fr; }
    .nav-links a:not(.gh-btn) { display: none; }
  }
  @media (max-width: 520px) { .kpis { grid-template-columns: repeat(2,1fr); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } .reveal { opacity: 1; transform: none; } }
</style>
</head>
<body>
<canvas id="net"></canvas>

<div id="scan">
  <div class="scan-logo">⊞</div>
  <div class="scan-lines" id="scanLines"></div>
  <div class="scan-bar"><i></i></div>
</div>

<header class="site">
  <div class="site-inner">
    <div class="brand">
      <div class="logo">⊞</div>
      <div>
        <h1>SAP Transaction Forensics</h1>
        <div class="sub">cross-system process forensics · read-only</div>
      </div>
    </div>
    <nav class="nav-links">
      <a href="#anomalies">Anomalies</a>
      <a href="#cross">Cross-System</a>
      <a href="#evidence">Evidence</a>
      <a class="gh-btn" href="https://github.com/chrbailey/SAP-Transaction-Forensics" target="_blank" rel="noopener">GitHub ↗</a>
    </nav>
  </div>
</header>

<main id="app"><div class="loading">Initializing forensic scan…</div></main>

<script src="findings-data.js"></script>
<script>
(function () {
  "use strict";

  const FLAG_LABELS = {
    QUARTER_END_COMPRESSION: "Quarter-End Compression", SPLIT_DEAL: "Split Deal",
    STALE_PIPELINE: "Stale Pipeline", AMOUNT_INFLATION: "Amount Inflation",
    GHOST_PIPELINE: "Ghost Pipeline", SPEED_ANOMALY: "Speed Anomaly",
    STAGE_SKIP: "Stage Skip", STAGE_REGRESSION: "Stage Regression",
    CROSS_SYSTEM_GAP: "Cross-System Gap", OWNER_SWAP_AT_CLOSE: "Owner Swap At Close",
  };
  const SEV_RANK = { critical: 0, high: 1, medium: 2, low: 3 };
  const SEV_WEIGHT = { critical: 10, high: 6, medium: 3, low: 1 };
  const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  const fmtMoney = v => v == null ? "—" : "$" + Number(v).toLocaleString("en-US",{maximumFractionDigits:0});
  const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  async function getData() {
    if (window.DEMO_FINDINGS) return window.DEMO_FINDINGS;
    try { const r = await fetch("findings.json",{cache:"no-store"}); if (r.ok) return await r.json(); } catch(e){}
    return null;
  }

  /* ---------- particle network background ---------- */
  function startNetwork() {
    const c = document.getElementById("net"), x = c.getContext("2d");
    let w, h, pts, raf;
    const N = Math.min(70, Math.floor((window.innerWidth*window.innerHeight)/26000));
    function resize(){ w=c.width=innerWidth; h=c.height=innerHeight; }
    function init(){ pts=[]; for(let i=0;i<N;i++) pts.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25}); }
    function tick(){
      x.clearRect(0,0,w,h);
      for(const p of pts){ p.x+=p.vx; p.y+=p.vy; if(p.x<0||p.x>w)p.vx*=-1; if(p.y<0||p.y>h)p.vy*=-1; }
      for(let i=0;i<pts.length;i++){
        for(let j=i+1;j<pts.length;j++){
          const a=pts[i],b=pts[j],dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy);
          if(d<140){ x.strokeStyle="rgba(99,179,255,"+(0.13*(1-d/140))+")"; x.lineWidth=1; x.beginPath(); x.moveTo(a.x,a.y); x.lineTo(b.x,b.y); x.stroke(); }
        }
        x.fillStyle="rgba(120,180,255,0.6)"; x.beginPath(); x.arc(pts[i].x,pts[i].y,1.4,0,7); x.fill();
      }
      raf=requestAnimationFrame(tick);
    }
    resize(); init(); tick();
    addEventListener("resize",()=>{ cancelAnimationFrame(raf); resize(); init(); tick(); });
  }

  /* ---------- scan intro ---------- */
  function runScan(d, done) {
    const host = document.getElementById("scanLines");
    const lines = [
      ["> connecting to synthetic dataset (seed 42)…", false],
      ["> loaded " + d.dataset.opportunities + " opportunities · " + d.dataset.sap_orders + " SAP orders", true],
      ["> running 10 forensic detectors…", false],
      ["> " + d.headline.anomaly_instances + " anomaly instances flagged", true],
      ["> correlating SFDC ↔ SAP…", false],
      ["> " + d.headline.cross_system_anomalies + " cross-system contradictions found", true],
      ["> rendering evidence…", false],
    ];
    let i = 0;
    (function next(){
      if (i >= lines.length) { setTimeout(done, 320); return; }
      const [txt, ok] = lines[i];
      const el = document.createElement("div");
      el.className = ok ? "" : "muted";
      el.textContent = txt; el.style.animationDelay = "0s";
      host.appendChild(el);
      i++; setTimeout(next, 300);
    })();
  }

  function animateCount(el, target, isMoney, isPct) {
    const dur = 1100, start = performance.now();
    const suffix = isPct ? "%" : "";
    function step(now){
      const t = Math.min(1,(now-start)/dur), e = 1-Math.pow(1-t,3), v = target*e;
      el.textContent = isMoney ? fmtMoney(v) : (Math.round(v).toLocaleString()+suffix);
      if(t<1) requestAnimationFrame(step); else el.textContent = isMoney ? fmtMoney(target) : (target.toLocaleString()+suffix);
    }
    requestAnimationFrame(step);
  }

  function kpis(d) {
    const h = d.headline;

      { v: h.win_rate_pct, lbl: "Win Rate", cls: "", pct: true },
      { v: h.avg_deal_size, lbl: "Avg Deal", cls: "", money: true },

    return `<div class="kpis">${items.map((i,k)=>
      `<div class="kpi ${i.cls}"><div class="num" data-v="${i.v}" data-money="${!!i.money}" data-pct="${!!i.pct}">0</div><div class="lbl">${esc(i.lbl)}</div></div>`

  }

  function riskScore(d) {
    let raw = 0;
    d.anomalies.forEach(a => raw += (SEV_WEIGHT[a.severity]||1) * a.count);
    raw += d.headline.cross_system_anomalies * 14;
    const flagged = d.headline.opportunities_flagged / Math.max(1,d.headline.opportunities_analyzed);
    const score = Math.max(8, Math.min(98, Math.round(38 + flagged*55 + Math.min(20, d.headline.cross_system_anomalies*6))));
    return score;
  }

  function riskBand(d) {
    const score = riskScore(d);

    return `
    <div class="riskband reveal">
      <div class="gauge">
        <svg width="200" height="200" viewBox="0 0 200 200">
          <circle cx="100" cy="100" r="${R}" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="14"/>
          <circle id="gaugeArc" cx="100" cy="100" r="${R}" fill="none" stroke="${color}" stroke-width="14" stroke-linecap="round"
            stroke-dasharray="${C}" stroke-dashoffset="${C}" style="transition:stroke-dashoffset 1.4s cubic-bezier(.2,.7,.2,1); filter:drop-shadow(0 0 8px ${color})" data-off="${off}"/>
        </svg>
        <div class="center"><div class="score" style="color:${color}" data-score="${score}">0</div><div class="of">RISK INDEX / 100</div></div>
      </div>
      <div class="riskcopy">
        <h4>Composite risk: weighted by severity × frequency</h4>

  function typeTerminal(el) {
    const full = el.getAttribute("data-script");
    el.removeAttribute("data-script");
    const tmp = document.createElement("div"); tmp.innerHTML = full;
    const nodes = Array.from(tmp.childNodes);
    let i = 0;
    const cur = document.createElement("span"); cur.className = "cursor"; cur.innerHTML = "&nbsp;";
    el.appendChild(cur);
    (function add(){
      if (i >= nodes.length) { return; }
      el.insertBefore(nodes[i].cloneNode(true), cur);
      i++; setTimeout(add, nodes[i-1].textContent.length>1 ? 90 : 30);
    })();
  }

  function activate(app) {
    // count-up KPIs
    app.querySelectorAll(".kpi .num").forEach(el=>{
      animateCount(el, parseFloat(el.dataset.v), el.dataset.money==="true", el.dataset.pct==="true");
    });
    // reveals
    const io = new IntersectionObserver((entries)=>{
      entries.forEach(e=>{
        if(!e.isIntersecting) return;
        const el = e.target; el.classList.add("in");
        el.querySelectorAll && el.querySelectorAll(".anom-bar i").forEach(b=>b.style.width=b.dataset.w+"%");
        el.querySelectorAll && el.querySelectorAll(".qbar .fill").forEach(f=>f.style.height=f.dataset.h+"%");
        const arc = el.querySelector && el.querySelector("#gaugeArc");
        if(arc){ arc.style.strokeDashoffset = arc.dataset.off; const sc=el.querySelector(".score"); animateCount(sc, parseInt(sc.dataset.score),false,false); }
        const term = el.querySelector && el.querySelector(".term-body[data-script]");
        if(term) typeTerminal(term);
        io.unobserve(el);
      });
    }, { threshold: 0.18 });
    app.querySelectorAll(".reveal").forEach(el=>io.observe(el));
    // anomaly expand
    app.querySelectorAll(".anom-top").forEach(t=>t.addEventListener("click",()=>t.closest(".anom").classList.toggle("open")));
  }

    document.body.appendChild(foot);

    document.getElementById("app").innerHTML =
      `<div class="loading"><p style="font-size:18px;color:var(--text)">Couldn't load findings data.</p><p style="margin-top:10px">Run <code>make demo-web</code> from the repo root, or serve this folder with <code>python3 -m http.server</code>.</p></div>`;
    document.getElementById("scan").classList.add("done");
  }

  try { startNetwork(); } catch(e){}
  getData().then(d=>{
    if(!d){ fail(); return; }
    runScan(d, ()=>{ document.getElementById("scan").classList.add("done"); render(d); });
  }).catch(fail);
})();
</script>
</body>
</html>
