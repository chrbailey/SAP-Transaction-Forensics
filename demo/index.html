<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAP Transaction Forensics — Live Demo</title>
<meta name="description" content="Forensic anomaly detection across SAP ERP and Salesforce CRM data. Read-only, evidence-graded, MIT licensed.">
<style>
  :root {
    --bg: #0a0e17;
    --surface: #111827;
    --surface2: #161f33;
    --surface3: #1c2742;
    --border: #1e2d45;
    --border-active: #3b82f6;
    --text: #e2e8f0;
    --text-muted: #94a3b8;
    --text-dim: #64748b;
    --accent: #3b82f6;
    --accent2: #8b5cf6;
    --accent-glow: rgba(59,130,246,0.15);
    --critical: #ef4444;
    --high: #f97316;
    --medium: #eab308;
    --low: #22c55e;
    --info: #64748b;
    --mono: 'SF Mono', 'Cascadia Code', 'JetBrains Mono', 'Fira Code', ui-monospace, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
    background-image:
      radial-gradient(800px circle at 10% -10%, rgba(59,130,246,0.10), transparent 40%),
      radial-gradient(700px circle at 100% 0%, rgba(139,92,246,0.10), transparent 40%);
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

  /* Header */
  header.site {
    border-bottom: 1px solid var(--border);
    background: rgba(10,14,23,0.85);
    backdrop-filter: blur(8px);
    position: sticky; top: 0; z-index: 50;
  }
  .site-inner { display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; max-width: 1200px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 34px; height: 34px; border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 18px; color: white;
    box-shadow: 0 4px 16px var(--accent-glow);
  }
  .brand h1 { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
  .brand .sub { font-size: 11px; color: var(--text-dim); font-family: var(--mono); }
  .nav-links { display: flex; gap: 18px; align-items: center; font-size: 13px; }
  .nav-links a { color: var(--text-muted); }
  .gh-btn {
    border: 1px solid var(--border); padding: 7px 14px; border-radius: 8px;
    color: var(--text); font-weight: 600; font-size: 13px;
  }
  .gh-btn:hover { border-color: var(--border-active); text-decoration: none; background: var(--surface2); }

  /* Hero */
  .hero { padding: 56px 0 28px; text-align: center; }
  .hero .eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--mono); font-size: 12px; color: var(--low);
    border: 1px solid rgba(34,197,94,0.3); background: rgba(34,197,94,0.06);
    padding: 5px 12px; border-radius: 999px; margin-bottom: 20px;
  }
  .hero .eyebrow .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--low); box-shadow: 0 0 8px var(--low); }
  .hero h2 { font-size: 40px; line-height: 1.12; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 16px; }
  .hero h2 .grad { background: linear-gradient(120deg, #60a5fa, #a78bfa); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero p.lede { font-size: 17px; color: var(--text-muted); max-width: 680px; margin: 0 auto 22px; }
  .badges { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .badge {
    font-family: var(--mono); font-size: 11.5px; color: var(--text-muted);
    border: 1px solid var(--border); border-radius: 7px; padding: 5px 11px; background: var(--surface);
  }
  .badge b { color: var(--text); }

  /* KPI grid */
  .kpis { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; margin: 34px 0 10px; }
  .kpi {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 18px 16px; text-align: center; position: relative; overflow: hidden;
  }
  .kpi::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 2px; background: linear-gradient(90deg, var(--accent), var(--accent2)); opacity: 0.7; }
  .kpi .num { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; line-height: 1; }
  .kpi .lbl { font-size: 11px; color: var(--text-dim); margin-top: 8px; text-transform: uppercase; letter-spacing: 0.04em; }
  .kpi.alert .num { color: var(--high); }
  .kpi.crit .num { color: var(--critical); }

  /* Sections */
  section.block { padding: 40px 0; border-top: 1px solid var(--border); margin-top: 24px; }
  .sec-head { margin-bottom: 22px; }
  .sec-head .kicker { font-family: var(--mono); font-size: 12px; color: var(--accent); letter-spacing: 0.05em; text-transform: uppercase; }
  .sec-head h3 { font-size: 24px; font-weight: 800; letter-spacing: -0.01em; margin-top: 4px; }
  .sec-head p { color: var(--text-muted); margin-top: 6px; max-width: 760px; }

  /* Anomaly cards */
  .anom-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .anom {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    overflow: hidden; transition: border-color .15s, transform .15s;
  }
  .anom:hover { border-color: var(--border-active); }
  .anom-top { display: flex; align-items: flex-start; gap: 14px; padding: 16px 18px; cursor: pointer; }
  .anom-count {
    flex-shrink: 0; min-width: 52px; height: 52px; border-radius: 10px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-weight: 800; font-size: 22px; line-height: 1;
    background: var(--surface3); border: 1px solid var(--border);
  }
  .anom-body { flex: 1; min-width: 0; }
  .anom-flag { font-family: var(--mono); font-size: 13.5px; font-weight: 700; display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
  .anom-desc { color: var(--text-muted); font-size: 13px; margin-top: 5px; }
  .sev {
    font-family: var(--mono); font-size: 10px; font-weight: 700; text-transform: uppercase;
    padding: 2px 7px; border-radius: 5px; letter-spacing: 0.04em;
  }
  .sev.critical { color: var(--critical); background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3); }
  .sev.high { color: var(--high); background: rgba(249,115,22,0.12); border: 1px solid rgba(249,115,22,0.3); }
  .sev.medium { color: var(--medium); background: rgba(234,179,8,0.12); border: 1px solid rgba(234,179,8,0.3); }
  .sev.low { color: var(--low); background: rgba(34,197,94,0.12); border: 1px solid rgba(34,197,94,0.3); }
  .anom-count.critical { color: var(--critical); border-color: rgba(239,68,68,0.4); }
  .anom-count.high { color: var(--high); border-color: rgba(249,115,22,0.4); }
  .anom-count.medium { color: var(--medium); border-color: rgba(234,179,8,0.4); }
  .anom-count.low { color: var(--low); border-color: rgba(34,197,94,0.4); }
  .chev { color: var(--text-dim); font-size: 12px; transition: transform .2s; margin-left: auto; padding-left: 10px; }
  .anom.open .chev { transform: rotate(90deg); }
  .evidence { display: none; border-top: 1px solid var(--border); background: var(--surface2); padding: 4px 0; }
  .anom.open .evidence { display: block; }
  .ev-row { padding: 11px 18px; border-bottom: 1px solid var(--border); font-size: 12.5px; }
  .ev-row:last-child { border-bottom: none; }
  .ev-name { font-weight: 600; color: var(--text); }
  .ev-meta { color: var(--text-dim); font-family: var(--mono); font-size: 11.5px; margin-top: 3px; display: flex; gap: 14px; flex-wrap: wrap; }
  .ev-meta b { color: var(--text-muted); font-weight: 600; }
  .ev-none { padding: 14px 18px; color: var(--text-dim); font-size: 12.5px; font-style: italic; }

  /* Cross-system */
  .cross-list { display: flex; flex-direction: column; gap: 12px; }
  .cross {
    display: flex; align-items: center; gap: 16px; background: var(--surface);
    border: 1px solid var(--border); border-left-width: 3px; border-radius: 10px; padding: 14px 18px;
  }
  .cross.high { border-left-color: var(--high); }
  .cross.medium { border-left-color: var(--medium); }
  .cross .ctype { font-family: var(--mono); font-size: 12px; font-weight: 700; min-width: 150px; }
  .cross .cev { color: var(--text-muted); font-size: 13px; flex: 1; }
  .cross .clink { font-family: var(--mono); font-size: 11px; color: var(--text-dim); text-align: right; }

  /* Quarter-end chart */
  .qchart { display: grid; grid-template-columns: 1fr; gap: 10px; }
  .qbars { display: flex; align-items: flex-end; gap: 8px; height: 200px; padding: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
  .qbar { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 6px; }
  .qbar .fill { width: 100%; border-radius: 4px 4px 0 0; background: var(--surface3); min-height: 2px; transition: height .4s ease; }
  .qbar.qend .fill { background: linear-gradient(180deg, var(--high), #c2410c); }
  .qbar .mlbl { font-size: 10px; color: var(--text-dim); font-family: var(--mono); }
  .qbar .vlbl { font-size: 11px; color: var(--text-muted); font-weight: 700; }
  .callout {
    margin-top: 16px; background: rgba(249,115,22,0.07); border: 1px solid rgba(249,115,22,0.25);
    border-radius: 10px; padding: 14px 18px; font-size: 14px;
  }
  .callout b { color: var(--high); }

  /* Two-col info */
  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  .panel h4 { font-size: 15px; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .stat-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .stat-row:last-child { border-bottom: none; }
  .stat-row .k { color: var(--text-muted); }
  .stat-row .v { font-family: var(--mono); font-weight: 700; }

  /* Evidence chain */
  .chain {
    font-family: var(--mono); font-size: 12.5px; background: #060912; border: 1px solid var(--border);
    border-radius: 12px; padding: 20px; overflow-x: auto; line-height: 1.8;
  }
  .chain .c-key { color: var(--accent); }
  .chain .c-sys { color: var(--accent2); }
  .chain .c-val { color: var(--low); }
  .chain .c-warn { color: var(--high); }
  .chain .c-dim { color: var(--text-dim); }

  /* CTA / footer */
  .cta { text-align: center; padding: 48px 0; }
  .cta h3 { font-size: 26px; font-weight: 800; margin-bottom: 12px; }
  .cta p { color: var(--text-muted); max-width: 620px; margin: 0 auto 22px; }
  .cta .code {
    display: inline-block; text-align: left; font-family: var(--mono); font-size: 13px;
    background: #060912; border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; color: var(--text);
  }
  .cta .code .cm { color: var(--text-dim); }
  footer.site { border-top: 1px solid var(--border); padding: 28px 0; color: var(--text-dim); font-size: 12.5px; text-align: center; }

  .loading { text-align: center; padding: 80px 24px; color: var(--text-muted); }

  @media (max-width: 880px) {
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .anom-grid, .info-grid { grid-template-columns: 1fr; }
    .hero h2 { font-size: 30px; }
    .nav-links a:not(.gh-btn) { display: none; }
  }
</style>
</head>
<body>
<header class="site">
  <div class="site-inner">
    <div class="brand">
      <div class="logo">⊞</div>
      <div>
        <h1>SAP Transaction Forensics</h1>
        <div class="sub">cross-system process forensics · read-only</div>
      </div>
    </div>
    <nav class="nav-links">
      <a href="#anomalies">Anomalies</a>
      <a href="#cross">Cross-System</a>
      <a href="#evidence">Evidence</a>
      <a class="gh-btn" href="https://github.com/chrbailey/SAP-Transaction-Forensics" target="_blank" rel="noopener">View on GitHub ↗</a>
    </nav>
  </div>
</header>

<main id="app">
  <div class="loading">Loading forensic findings…</div>
</main>

<script src="findings-data.js"></script>
<script>
(function () {
  "use strict";

  const FLAG_LABELS = {
    QUARTER_END_COMPRESSION: "Quarter-End Compression",
    SPLIT_DEAL: "Split Deal",
    STALE_PIPELINE: "Stale Pipeline",
    AMOUNT_INFLATION: "Amount Inflation",
    GHOST_PIPELINE: "Ghost Pipeline",
    SPEED_ANOMALY: "Speed Anomaly",
    STAGE_SKIP: "Stage Skip",
    STAGE_REGRESSION: "Stage Regression",
    CROSS_SYSTEM_GAP: "Cross-System Gap",
    OWNER_SWAP_AT_CLOSE: "Owner Swap At Close",
  };
  const SEV_RANK = { critical: 0, high: 1, medium: 2, low: 3 };
  const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  function fmtMoney(v) {
    if (v == null) return "—";
    return "$" + Number(v).toLocaleString("en-US", { maximumFractionDigits: 0 });
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  }

  async function getData() {
    if (window.DEMO_FINDINGS) return window.DEMO_FINDINGS;
    // Fallback for live (server-served) mode
    try {
      const r = await fetch("findings.json", { cache: "no-store" });
      if (r.ok) return await r.json();
    } catch (e) { /* file:// fetch blocked — handled below */ }
    return null;
  }

  function kpis(d) {
    const h = d.headline;
    const items = [
      { num: h.opportunities_analyzed, lbl: "Opportunities", cls: "" },
      { num: h.opportunities_flagged, lbl: "Flagged", cls: "alert" },
      { num: h.anomaly_categories, lbl: "Anomaly Types", cls: "alert" },
      { num: h.cross_system_anomalies, lbl: "Cross-System", cls: "crit" },
      { num: h.win_rate_pct + "%", lbl: "Win Rate", cls: "" },
      { num: fmtMoney(h.avg_deal_size), lbl: "Avg Deal", cls: "" },
    ];
    return `<div class="kpis">${items.map(i =>
      `<div class="kpi ${i.cls}"><div class="num">${esc(i.num)}</div><div class="lbl">${esc(i.lbl)}</div></div>`
    ).join("")}</div>`;
  }

  function anomalyCard(a) {
    const label = FLAG_LABELS[a.flag] || a.flag;
    const examples = (a.examples || []).map(e => `
      <div class="ev-row">
        <div class="ev-name">${esc(e.name || e.id)}</div>
        <div class="ev-meta">
          <span><b>Account:</b> ${esc(e.account_name || "—")}</span>
          <span><b>Amount:</b> ${fmtMoney(e.amount)}</span>
          <span><b>Stage:</b> ${esc(e.stage || "—")}</span>
          <span><b>Close:</b> ${esc(e.close_date || "—")}</span>
          <span><b>ID:</b> ${esc(e.id)}</span>
        </div>
      </div>`).join("");
    const evidence = examples
      ? examples
      : `<div class="ev-none">No instances detected in this dataset.</div>`;
    return `
    <div class="anom" data-flag="${esc(a.flag)}">
      <div class="anom-top">
        <div class="anom-count ${esc(a.severity)}">${a.count}</div>
        <div class="anom-body">
          <div class="anom-flag">${esc(label)} <span class="sev ${esc(a.severity)}">${esc(a.severity)}</span></div>
          <div class="anom-desc">${esc(a.description)}</div>
        </div>
        <span class="chev">▶</span>
      </div>
      <div class="evidence">${evidence}</div>
    </div>`;
  }

  function anomaliesSection(d) {
    const sorted = [...d.anomalies].sort((a, b) =>
      (SEV_RANK[a.severity] - SEV_RANK[b.severity]) || (b.count - a.count));
    return `
    <section class="block" id="anomalies"><div class="wrap">
      <div class="sec-head">
        <div class="kicker">Detection Layer</div>
        <h3>Anomaly Detection</h3>
        <p>Ten forensic pattern checks run across every opportunity. Each instance links to specific records — click any card to inspect the evidence. Counts below come straight from the analysis you can reproduce with <code>make demo</code>.</p>
      </div>
      <div class="anom-grid">${sorted.map(anomalyCard).join("")}</div>
    </div></section>`;
  }

  function crossSection(d) {
    const c = d.cross_system;
    const rows = (c.examples || []).map(e => `
      <div class="cross ${esc(e.severity)}">
        <div class="ctype">${esc(e.type)}</div>
        <div class="cev">${esc(e.evidence)}</div>
        <div class="clink">${esc(e.sfdc_id || "")}${e.sap_id ? " ↔ " + esc(e.sap_id) : ""}</div>
      </div>`).join("");
    return `
    <section class="block" id="cross"><div class="wrap">
      <div class="sec-head">
        <div class="kicker">Correlation Layer</div>
        <h3>Cross-System Correlation — SFDC ↔ SAP</h3>
        <p>The CRM says one thing; the ERP says another. Entity resolution matches Salesforce opportunities to SAP sales orders, then flags the contradictions: timing gaps, amount discrepancies, sequence violations, and missing handoffs.</p>
      </div>
      <div class="info-grid" style="margin-bottom:18px">
        <div class="panel">
          <h4>Match Coverage</h4>
          <div class="stat-row"><span class="k">SFDC opportunities</span><span class="v">${c.total_sfdc}</span></div>
          <div class="stat-row"><span class="k">SAP sales orders</span><span class="v">${c.total_sap}</span></div>
          <div class="stat-row"><span class="k">Matched pairs</span><span class="v">${c.matched_pairs}</span></div>
          <div class="stat-row"><span class="k">Match rate</span><span class="v">${c.match_rate_pct}%</span></div>
          <div class="stat-row"><span class="k">Avg timing gap</span><span class="v">${c.avg_gap_days} days</span></div>
        </div>
        <div class="panel">
          <h4>What low coverage means</h4>
          <p style="color:var(--text-muted);font-size:13px">Only <b style="color:var(--text)">${c.match_rate_pct}%</b> of CRM opportunities trace to an SAP order. The rest closed in Salesforce with no corresponding ERP record — revenue booked in the pipeline that never became a fulfilled order. That gap is exactly where leakage and premature revenue recognition hide.</p>
        </div>
      </div>
      <div class="cross-list">${rows || '<div class="ev-none">No cross-system anomalies in this dataset.</div>'}</div>
    </div></section>`;
  }

  function quarterSection(d) {
    const q = d.quarter_end;
    const max = Math.max(1, ...q.months.map(m => m.count));
    const bars = q.months.map((m, i) => {
      const h = Math.round((m.count / max) * 100);
      return `<div class="qbar ${m.is_qtr_end ? "qend" : ""}">
        <div class="vlbl">${m.count}</div>
        <div class="fill" style="height:${h}%"></div>
        <div class="mlbl">${MONTHS[i]}</div>
      </div>`;
    }).join("");
    return `
    <section class="block"><div class="wrap">
      <div class="sec-head">
        <div class="kicker">Behavioral Signal</div>
        <h3>Quarter-End Compression</h3>
        <p>When deals cluster into the last month of each quarter (Mar / Jun / Sep / Dec, highlighted), it is a classic signature of pipeline sandbagging and forecast gaming.</p>
      </div>
      <div class="qbars">${bars}</div>
      <div class="callout">
        <b>${q.qtr_end_pct}%</b> of closed deals landed in a quarter-end month — <b>${q.ratio}×</b> the ${q.expected_pct}% you'd expect if closes were evenly distributed. ${q.qtr_end_count} of ${q.total_closed} closed opportunities.
      </div>
    </div></section>`;
  }

  function evidenceSection(d) {
    const ex = (d.cross_system.examples || [])[0];
    const a = (d.anomalies.find(x => (x.examples || []).length) || {});
    const sample = (a.examples || [])[0] || {};
    return `
    <section class="block" id="evidence"><div class="wrap">
      <div class="sec-head">
        <div class="kicker">Evidence Infrastructure</div>
        <h3>Every Finding Is Traceable</h3>
        <p>This is not a black box. Each finding carries field-level provenance — system, table, record, field, value, timestamp — plus a replay hash so a reviewer can verify it without ever touching the model. Below is the shape of one finding's evidence chain.</p>
      </div>
      <div class="chain">
<span class="c-dim">Finding:</span> <span class="c-warn">CROSS_SYSTEM_GAP</span> on Opportunity <span class="c-val">${esc(sample.id || "006…")}</span>
  <span class="c-dim">Evidence:</span>
    <span class="c-sys">SFDC</span>.Opportunity.<span class="c-key">CloseDate</span>  = <span class="c-val">${esc((ex && ex.evidence && (ex.evidence.match(/close \(([^)]+)\)/) || [])[1]) || sample.close_date || "—")}</span>
    <span class="c-sys">SAP</span>.VBAK.<span class="c-key">ERDAT</span>        = <span class="c-val">${esc((ex && ex.evidence && (ex.evidence.match(/erdat \(([^)]+)\)/) || [])[1]) || "—")}</span>
    <span class="c-dim">Delta:</span> <span class="c-warn">${esc((ex && ex.evidence && (ex.evidence.match(/Gap of (\d+ days)/) || [])[1]) || "—")}</span>  <span class="c-dim">(SFDC closed before SAP order existed)</span>
  <span class="c-dim">Provenance:</span>
    Extraction Path : <span class="c-key">sfdc-o2c-opportunity v1.0</span>
    Replay Hash     : <span class="c-key">sha256:${esc((sample.id || "0".repeat(16)).slice(-8))}…a7f3b2</span>
  <span class="c-dim">State:</span> <span class="c-warn">CONFIRMED</span> <span class="c-dim">→ ready for reviewer handoff packet</span>
      </div>
    </div></section>`;
  }

  function conformanceSection(d) {
    const c = d.conformance;
    const devs = Object.entries(c.deviation_types || {}).sort((a, b) => b[1] - a[1]);
    return `
    <section class="block"><div class="wrap">
      <div class="info-grid">
        <div class="panel">
          <h4>Conformance — New Business Pipeline</h4>
          <div class="stat-row"><span class="k">Reference model</span><span class="v">${esc(c.model)}</span></div>
          <div class="stat-row"><span class="k">Cases analyzed</span><span class="v">${c.total_cases}</span></div>
          <div class="stat-row"><span class="k">Conformant</span><span class="v">${c.conformance_rate_pct}%</span></div>
          <div class="stat-row"><span class="k">Average fitness</span><span class="v">${c.average_fitness}</span></div>
          <div class="stat-row"><span class="k">Total deviations</span><span class="v">${c.total_deviations}</span></div>
        </div>
        <div class="panel">
          <h4>Deviation Types</h4>
          ${devs.length ? devs.map(([k, v]) =>
            `<div class="stat-row"><span class="k">${esc(k)}</span><span class="v">${v}</span></div>`).join("")
            : '<p style="color:var(--text-dim)">No critical deviations detected.</p>'}
        </div>
      </div>
    </div></section>`;
  }

  function hero(d) {
    const h = d.headline;
    const ds = d.dataset;
    return `
    <div class="hero"><div class="wrap">
      <div class="eyebrow"><span class="dot"></span> Live findings · generated by the analysis pipeline</div>
      <h2>Find the anomalies your<br><span class="grad">rule engine can't see</span></h2>
      <p class="lede">A read-only forensic pass over ${ds.opportunities} Salesforce opportunities and ${ds.sap_orders} linked SAP orders surfaced <b style="color:var(--text)">${h.anomaly_instances} anomaly instances</b> across <b style="color:var(--text)">${h.anomaly_categories} categories</b> — and <b style="color:var(--text)">${h.cross_system_anomalies}</b> contradictions between what CRM and ERP claim happened.</p>
      <div class="badges">
        <span class="badge">🔒 <b>Read-only</b></span>
        <span class="badge">🧪 Synthetic data · <b>seed ${ds.seed}</b></span>
        <span class="badge">♻️ <b>Reproducible</b> — <code>make demo</code></span>
        <span class="badge">⚖️ <b>MIT</b> licensed</span>
      </div>
      ${kpis(d)}
    </div></div>`;
  }

  function cta() {
    return `
    <section class="block"><div class="wrap"><div class="cta">
      <h3>Run this on your own machine in 60 seconds</h3>
      <p>No SAP access required. Synthetic data is generated deterministically (seed 42), analyzed, and rendered into the exact dashboard you're looking at — all locally, all read-only.</p>
      <div class="code">
        <span class="cm"># clone, then:</span><br>
        make demo-web<br>
        <span class="cm"># → generates data, runs forensics, opens this dashboard</span>
      </div>
      <p style="margin-top:22px">
        <a class="gh-btn" href="https://github.com/chrbailey/SAP-Transaction-Forensics" target="_blank" rel="noopener">Star on GitHub ↗</a>
      </p>
    </div></div></section>`;
  }

  function render(d) {
    const app = document.getElementById("app");
    app.innerHTML =
      hero(d) +
      anomaliesSection(d) +
      crossSection(d) +
      quarterSection(d) +
      evidenceSection(d) +
      conformanceSection(d) +
      cta(d);

    // Expand/collapse anomaly cards
    app.querySelectorAll(".anom-top").forEach(top => {
      top.addEventListener("click", () => top.closest(".anom").classList.toggle("open"));
    });
    // Animate bars after paint
    requestAnimationFrame(() => {
      app.querySelectorAll(".qbar .fill").forEach(f => { f.style.height = f.style.height; });
    });

    // Footer
    const foot = document.createElement("footer");
    foot.className = "site";
    foot.innerHTML = `<div class="wrap">Generated ${esc((d.generated_at || "").slice(0, 10))} · ${d.dataset.opportunities} opportunities · ${d.dataset.event_log_records} event-log records · seed ${d.dataset.seed}.
      Built by <a href="https://github.com/chrbailey" target="_blank" rel="noopener">Christopher Bailey</a> · MIT License ·
      <a href="https://github.com/chrbailey/SAP-Transaction-Forensics" target="_blank" rel="noopener">source</a></div>`;
    document.body.appendChild(foot);
  }

  function fail() {
    document.getElementById("app").innerHTML = `
      <div class="loading">
        <p style="font-size:18px;color:var(--text)">Couldn't load findings data.</p>
        <p style="margin-top:10px">If you opened this file directly, run <code>make demo-web</code> from the repo root,
        or serve this folder with <code>python3 -m http.server</code> so the data file can load.</p>
      </div>`;
  }

  getData().then(d => { d ? render(d) : fail(); }).catch(fail);
})();
</script>
</body>
</html>
